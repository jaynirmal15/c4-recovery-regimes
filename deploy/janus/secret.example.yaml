# Template for deploy/janus/secret.local.yaml (which is ignored by Git and never committed).
# Copy this file to secret.local.yaml, replace the placeholder, and apply it before the
# Janus deployment, which reads the value from this Secret.
apiVersion: v1
kind: Secret
metadata: { name: janus-admin, namespace: c4-janus }
stringData:
  admin_secret: REPLACE_WITH_A_RANDOM_STRING
