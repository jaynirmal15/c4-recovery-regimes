# Template for deploy/livekit/secrets.local.yaml (which is ignored by Git and never committed).
# Copy this file to secrets.local.yaml and replace the placeholders with your own values.
# It is passed to Helm as an extra values file alongside values.yaml.
#
# Generate a key pair with `livekit-server generate-keys`
# or any random generator: the key is an identifier beginning "API", the secret a long random string.
storeKeysInSecret:
  enabled: true
  keys:
    APIxxxxxxxxxxxx: REPLACE_WITH_API_SECRET
livekit:
  webhook:
    # must be the same key identifier as above; LiveKit signs webhooks with it
    api_key: APIxxxxxxxxxxxx
